<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#000a02" />
  <meta name="description" content="Radio Antomatee — polskie i światowe stacje radiowe online. Klubowe, rave, hardstyle i więcej." />
  <title>Radio Antomatee</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Favicon (SVG, inline) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23d54d1d'/><stop offset='1' stop-color='%239a2e0a'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><circle cx='32' cy='36' r='5' fill='%23fffbf5'/><path d='M18 36a14 14 0 0 1 28 0' stroke='%23fffbf5' stroke-width='3' stroke-linecap='round' fill='none'/><path d='M11 36a21 21 0 0 1 42 0' stroke='%23fffbf5' stroke-width='2.5' stroke-linecap='round' fill='none' opacity='.55'/><circle cx='32' cy='17' r='2.4' fill='%23fffbf5'/></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Radio Browser API mirrors — szybsze pierwsze połączenie -->
  <link rel="dns-prefetch" href="https://de1.api.radio-browser.info">
  <link rel="dns-prefetch" href="https://de2.api.radio-browser.info">
  <link rel="dns-prefetch" href="https://fr1.api.radio-browser.info">
  <link rel="dns-prefetch" href="https://nl1.api.radio-browser.info">

  <!-- HLS dla streamów m3u8 (Polskie Radio itd.) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div class="crt" aria-hidden="true"></div>

<div id="shell">

  <!-- ══ TOP BAR: marka · wyszukiwarka · motyw ══ -->
  <header id="header">
    <div class="brandGroup">
      <div class="brandMark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="14" r="2.2" fill="#fff"/>
          <path d="M6.5 14a5.5 5.5 0 0 1 11 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3 14a9 9 0 0 1 18 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>
          <circle cx="12" cy="5.5" r="1" fill="#fff"/>
        </svg>
      </div>
      <div class="brandText">
        <div class="brandTitle">Radio <em>Antomatee</em></div>
        <div class="brandSub">
          <span class="liveDot" id="statusDot"></span>
          <span id="statusText">Ładowanie…</span>
          <span class="onlineChip" id="onlineChip" hidden title="Osoby korzystające teraz z aplikacji">
            <span class="onlineDot"></span>Słuchaczy:&nbsp;<b id="onlineCount">—</b>
          </span>
        </div>
      </div>
    </div>

    <div class="headSearch">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
        <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="search" type="text" placeholder="Szukaj stacji, gatunku, kraju…" autocomplete="off" />
      <button class="railBtn ghost" id="btnFiltersMobile" type="button" aria-label="Filtry" title="Filtry">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="toolbar">
      <div class="themeWrap">
        <button class="themeBtn" id="btnTheme" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="themeMenu" aria-label="Wybierz motyw" title="Wybierz motyw">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.4-1.9-.3-.9.3-1.9 1.3-1.9H16a5 5 0 0 0 5-5c0-4.4-4-8.2-9-8.2z"/>
            <circle cx="7.5" cy="12" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="10" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="14.5" cy="7.5" r="1.1" fill="currentColor" stroke="none"/>
            <circle cx="17" cy="11" r="1.1" fill="currentColor" stroke="none"/>
          </svg>
          <span class="themeBtnLabel">Motyw</span>
        </button>
        <div class="themeMenu" id="themeMenu" role="menu" aria-label="Motywy" hidden>
          <div class="themeMenuTitle">Wybierz motyw</div>
          <button class="themeOpt" data-theme-val="green"     role="menuitemradio"><span class="tsw" style="--sw:#00ff41">🖥️</span>Matrix<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="amber"     role="menuitemradio"><span class="tsw" style="--sw:#ffb000">🍯</span>Bursztyn<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="cyan"      role="menuitemradio"><span class="tsw" style="--sw:#22d3ee">❄️</span>Lód<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="synthwave" role="menuitemradio"><span class="tsw" style="--sw:#ff3ca6">🌆</span>Synthwave<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="crimson"   role="menuitemradio"><span class="tsw" style="--sw:#e11d1d">🩸</span>Krwista<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="violet"    role="menuitemradio"><span class="tsw" style="--sw:#a970ff">🔮</span>Fiolet<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="cats"      role="menuitemradio"><span class="tsw" style="--sw:#ff9a52">🐱</span>Koty<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
          <button class="themeOpt" data-theme-val="naruto"    role="menuitemradio"><span class="tsw" style="--sw:#ff7a18">🍥</span>Naruto<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4L19 6"/></svg></span></button>
        </div>
      </div>
    </div>
  </header>

  <!-- ══ GŁÓWNY UKŁAD: rail filtrów · siatka kart · teraz gra ══ -->
  <div id="main">

    <!-- LEWY PANEL: FILTRY -->
    <aside id="filterRail">
      <div class="railHead">
        <span class="railTitle">Filtry</span>
        <span class="filterBadge" id="filterBadge" hidden>0</span>
      </div>

      <div class="railSection">
        <div class="railLabel">Szybkie</div>
        <label class="railChip" id="onlyPLChip" title="Tylko polskie stacje">
          <input type="checkbox" id="onlyPL" />
          <span class="railChipIco">🇵🇱</span> Polskie
        </label>
        <label class="railChip" id="onlyClubChip" title="Klubowe / dance / rave / hardstyle / techno">
          <input type="checkbox" id="onlyClub" />
          <span class="railChipIco">🎧</span> Klubowe
        </label>
        <label class="railChip" id="onlyFavChip" title="Tylko ulubione">
          <input type="checkbox" id="onlyFav" />
          <span class="railChipIco">★</span> Ulubione
        </label>
      </div>

      <div class="railSection">
        <div class="railLabel">Filtruj</div>
        <select class="select" id="filterCountry" aria-label="Kraj"></select>
        <select class="select" id="filterGenre" aria-label="Gatunek"></select>
        <select class="select" id="sortMode" aria-label="Sortowanie">
          <optgroup label="Nazwa">
            <option value="name">A &#8594; Z</option>
            <option value="name-desc">Z &#8594; A</option>
          </optgroup>
          <optgroup label="Kraj">
            <option value="country">Kraj A &#8594; Z</option>
            <option value="country-desc">Kraj Z &#8594; A</option>
          </optgroup>
          <optgroup label="Jako&#347;&#263; / gatunek">
            <option value="genre">Gatunek</option>
            <option value="bitrate">Bitrate &#8595;</option>
            <option value="bitrate-asc">Bitrate &#8593;</option>
          </optgroup>
          <optgroup label="Inne">
            <option value="fav">Ulubione naprz&#243;d</option>
            <option value="hit">HIT naprz&#243;d</option>
          </optgroup>
        </select>
      </div>

      <div class="railSection railTools">
        <button class="railBtn" id="btnClear" type="button">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          Wyczy&#347;&#263;
        </button>
        <button class="railBtn" id="btnRefresh" type="button" title="Pobierz &#347;wie&#380;&#261; list&#281; stacji z API">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Od&#347;wie&#380;
        </button>
      </div>
    </aside>

    <!-- CENTRUM: SIATKA STACJI -->
    <section id="centerCol">
      <div id="listHead">
        <span>Stacje · <span id="countInfo">0 / 0</span><span id="brokenBadge" class="brokenBadge" style="display:none;"></span></span>
        <span id="listHint">dwuklik = uruchom</span>
      </div>
      <div id="stationList" tabindex="0"></div>
    </section>

    <!-- PRAWY PANEL: TERAZ GRA + GLOBUS -->
    <aside id="rightPanel">
      <div class="panelBlock">
        <div class="panelTitle">Teraz gra</div>
        <div class="npHero">
          <div class="npArt" id="npArt">
            <canvas id="globeCanvas" aria-hidden="true"></canvas>
            <div class="npStatusChip" id="npArtStatus">Offline</div>
            <div class="npEq paused" id="npEq">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="npStation" id="npStation"><span class="idle">Wybierz stację</span></div>
          <div class="npMeta" id="npMeta">—</div>
          <div class="npStats" id="npStats"></div>
        </div>
      </div>

      <div class="panelBlock kbdBlock">
        <div class="panelTitle">Skróty klawiaturowe</div>
        <div class="kbdList">
          <div class="kbdRow"><span class="kbdLabel">Wybór stacji</span><span class="kbdKeys"><span class="kbdKey">↑</span><span class="kbdKey">↓</span></span></div>
          <div class="kbdRow"><span class="kbdLabel">Uruchom wybraną</span><span class="kbdKeys"><span class="kbdKey">Enter</span></span></div>
          <div class="kbdRow"><span class="kbdLabel">Graj / Pauza</span><span class="kbdKeys"><span class="kbdKey">Spacja</span></span></div>
          <div class="kbdRow"><span class="kbdLabel">Poprzednia / następna</span><span class="kbdKeys"><span class="kbdKey">←</span><span class="kbdKey">→</span></span></div>
          <div class="kbdRow"><span class="kbdLabel">Ulubione / Wycisz</span><span class="kbdKeys"><span class="kbdKey">F</span><span class="kbdKey">M</span></span></div>
        </div>
      </div>
    </aside>
  </div>
</div>

<!-- ══ DOLNY PASEK ODTWARZACZA (desktop + mobile) ══ -->
<div id="playerBar">
  <div class="pbInner">
    <div class="pbNow">
      <div class="mpArt paused" id="mpArt">
        <div class="mpEq"><span></span><span></span><span></span></div>
      </div>
      <div class="pbText">
        <div class="mpName" id="mpName">Wybierz stację</div>
        <div class="mpMeta" id="mpMeta">—</div>
      </div>
    </div>

    <div class="pbControls">
      <button class="ctrlBtn" id="btnPrev" title="Poprzednia (←)" aria-label="Poprzednia">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M6 5v14M18 5L8 12l10 7V5z"/></svg>
      </button>
      <button class="ctrlBtn primary" id="btnPlay" title="Graj / Pauza (spacja)" aria-label="Graj">
        <svg id="btnPlayIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M7 5l12 7-12 7V5z"/></svg>
      </button>
      <button class="ctrlBtn" id="btnNext" title="Następna (→)" aria-label="Następna">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M18 5v14M6 5l10 7-10 7V5z"/></svg>
      </button>
      <button class="ctrlBtn" id="btnStop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>
      </button>
    </div>

    <div class="pbVol volWrap" title="Głośność">
      <svg id="volIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 9v6h4l5 4V5L9 9H5z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <input type="range" class="volSlider" id="volSlider" min="0" max="100" value="65" step="1" />
      <span class="volLabel" id="volLabel">65%</span>
    </div>
  </div>
</div>

<script defer src="js/worlddata.js"></script>
<script defer src="js/globe.js"></script>
<script defer src="js/rain.js"></script>
<script defer src="js/app.js"></script>
<script defer src="js/presence.js"></script>
</body>
</html>
