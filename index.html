<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f7f1e8" />
  <meta name="description" content="Radio Antomatee — polskie i światowe stacje radiowe online. Klubowe, rave, hardstyle i więcej." />
  <title>Radio Antomatee</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Favicon (SVG, inline) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23d54d1d'/><stop offset='1' stop-color='%239a2e0a'/></linearGradient></defs><rect width='64' height='64' rx='14' fill='url(%23g)'/><circle cx='32' cy='36' r='5' fill='%23fffbf5'/><path d='M18 36a14 14 0 0 1 28 0' stroke='%23fffbf5' stroke-width='3' stroke-linecap='round' fill='none'/><path d='M11 36a21 21 0 0 1 42 0' stroke='%23fffbf5' stroke-width='2.5' stroke-linecap='round' fill='none' opacity='.55'/><circle cx='32' cy='17' r='2.4' fill='%23fffbf5'/></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Radio Browser API mirrors — szybsze pierwsze połączenie -->
  <link rel="dns-prefetch" href="https://de1.api.radio-browser.info">
  <link rel="dns-prefetch" href="https://de2.api.radio-browser.info">
  <link rel="dns-prefetch" href="https://fr1.api.radio-browser.info">
  <link rel="dns-prefetch" href="https://nl1.api.radio-browser.info">

  <!-- HLS dla streamów m3u8 (Polskie Radio itd.) -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="shell">

  <!-- HEADER -->
  <div id="header">
    <div class="brandGroup">
      <div class="brandMark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="14" r="2.2" fill="#fff"/>
          <path d="M6.5 14a5.5 5.5 0 0 1 11 0" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M3 14a9 9 0 0 1 18 0" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".65"/>
          <circle cx="12" cy="5.5" r="1" fill="#fff"/>
        </svg>
      </div>
      <div class="brandText">
        <div class="brandTitle">Radio <em>Antomatee</em></div>
        <div class="brandSub">
          <span class="liveDot" id="statusDot"></span>
          <span id="statusText">Ładowanie…</span>
        </div>
      </div>
    </div>

    <div class="toolbar">
      <button class="ctrlBtn" id="btnPrev" title="Poprzednia (←)" aria-label="Poprzednia">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 5v14M18 5L8 12l10 7V5z" fill="currentColor"/>
        </svg>
      </button>
      <button class="ctrlBtn primary" id="btnPlay" title="Graj / Pauza (spacja)" aria-label="Graj">
        <svg id="btnPlayIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 5l12 7-12 7V5z"/>
        </svg>
      </button>
      <button class="ctrlBtn" id="btnNext" title="Następna (→)" aria-label="Następna">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 5v14M6 5l10 7-10 7V5z" fill="currentColor"/>
        </svg>
      </button>
      <button class="ctrlBtn" id="btnStop" title="Stop" aria-label="Stop">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="6" width="12" height="12" rx="1.5"/>
        </svg>
      </button>
      <div class="volWrap" title="Głośność">
        <svg id="volIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M5 9v6h4l5 4V5L9 9H5z" fill="currentColor"/>
          <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <input type="range" class="volSlider" id="volSlider" min="0" max="100" value="65" step="1" />
        <span class="volLabel" id="volLabel">65%</span>
      </div>
    </div>
  </div>

  <!-- MAIN -->
  <div id="main">
    <div id="leftPanel">

      <!-- FILTRY + NARZĘDZIA -->
      <div id="filterSection">
        <div class="searchField">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.8"/>
            <path d="M20 20l-3.5-3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
          <input id="search" type="text" placeholder="Szukaj stacji, gatunku, kraju…" autocomplete="off" />
        </div>
        <div class="filterRow">
          <select class="select" id="filterCountry" aria-label="Kraj"></select>
          <select class="select" id="filterGenre" aria-label="Gatunek"></select>
          <select class="select" id="sortMode" aria-label="Sortowanie">
            <option value="name">A — Z</option>
            <option value="country">Kraj</option>
            <option value="bitrate">Bitrate</option>
          </select>
          <label class="chipBtn" id="onlyPLChip" title="Tylko polskie stacje">
            <input type="checkbox" id="onlyPL" />
            <span class="chipFlag">🇵🇱</span>
            Polskie
          </label>
          <label class="chipBtn" id="onlyClubChip" title="Klubowe / dance / rave / hardstyle / techno">
            <input type="checkbox" id="onlyClub" />
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/>
              <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
              <path d="M12 6.5a5.5 5.5 0 0 1 5.5 5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".55"/>
            </svg>
            Klubowe
          </label>
          <label class="chipBtn" id="onlyFavChip">
            <input type="checkbox" id="onlyFav" />
            <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2.5l2.9 6.3 6.9.7-5.2 4.7 1.5 6.8L12 17.7 5.9 21l1.5-6.8L2.2 9.5l6.9-.7L12 2.5z"/>
            </svg>
            Ulubione
          </label>
        </div>
        <div class="toolRow">
          <button class="chipBtn" id="btnClear">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M6 6l12 12M6 18L18 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            Wyczyść filtry
          </button>
          <button class="chipBtn" id="btnRefresh" title="Pobierz świeżą listę stacji z API">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Odśwież
          </button>
          <button class="chipBtn" id="btnUnblock" title="Odblokuj stacje z błędami">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            Odblokuj
          </button>
          <button class="chipBtn danger" id="btnResetStorage">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
            Reset
          </button>
        </div>
      </div>

      <div id="listHead">
        <span>Stacje · <span id="countInfo">0 / 0</span><span id="brokenBadge" class="brokenBadge" style="display:none;"></span></span>
        <span id="listHint">dwuklik = uruchom</span>
      </div>

      <div id="stationList" tabindex="0"></div>
    </div>

    <!-- PRAWY PANEL: TERAZ GRA + GLOBUS -->
    <div id="rightPanel">
      <div class="panelBlock">
        <div class="panelTitle">Teraz gra</div>
        <div class="npHero">
          <div class="npArt" id="npArt">
            <canvas id="globeCanvas" aria-hidden="true"></canvas>
            <div class="npStatusChip" id="npArtStatus">Offline</div>
            <div class="npEq paused" id="npEq">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>
          <div class="npStation" id="npStation"><span class="idle">Wybierz stację</span></div>
          <div class="npMeta" id="npMeta">—</div>
          <div class="npStats" id="npStats"></div>
        </div>
      </div>

      <div class="panelBlock">
        <div class="panelTitle">Skróty klawiaturowe</div>
        <div class="kbdList">
          <div class="kbdRow">
            <span class="kbdLabel">Wybór stacji</span>
            <span class="kbdKeys"><span class="kbdKey">↑</span><span class="kbdKey">↓</span></span>
          </div>
          <div class="kbdRow">
            <span class="kbdLabel">Uruchom wybraną</span>
            <span class="kbdKeys"><span class="kbdKey">Enter</span></span>
          </div>
          <div class="kbdRow">
            <span class="kbdLabel">Graj / Pauza</span>
            <span class="kbdKeys"><span class="kbdKey">Spacja</span></span>
          </div>
          <div class="kbdRow">
            <span class="kbdLabel">Poprzednia / następna</span>
            <span class="kbdKeys"><span class="kbdKey">←</span><span class="kbdKey">→</span></span>
          </div>
          <div class="kbdRow">
            <span class="kbdLabel">Ulubione</span>
            <span class="kbdKeys"><span class="kbdKey">F</span></span>
          </div>
          <div class="kbdRow">
            <span class="kbdLabel">Wycisz</span>
            <span class="kbdKeys"><span class="kbdKey">M</span></span>
          </div>
          <div class="kbdRow">
            <span class="kbdLabel">Szukaj</span>
            <span class="kbdKeys"><span class="kbdKey">S</span></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ODTWARZACZ MOBILNY -->
<div id="mobilePlayer">
  <div class="mpInner">
    <div class="mpArt paused" id="mpArt">
      <div class="mpEq"><span></span><span></span><span></span></div>
    </div>
    <div class="mpInfo">
      <div class="mpName" id="mpName">Wybierz stację</div>
      <div class="mpMeta" id="mpMeta">—</div>
    </div>
    <div class="mpControls">
      <button class="mpBtn" id="mpPrev" aria-label="Poprzednia">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 5v14M18 5L8 12l10 7V5z"/>
        </svg>
      </button>
      <button class="mpBtnPlay" id="mpPlay" aria-label="Graj">
        <svg id="mpPlayIcon" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M7 5l12 7-12 7V5z"/>
        </svg>
      </button>
      <button class="mpBtn" id="mpNext" aria-label="Następna">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M18 5v14M6 5l10 7-10 7V5z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script defer src="js/worlddata.js"></script>
<script defer src="js/globe.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
